services:
  mongo:
    image: mongodb/mongodb-community-server:8.0-ubi8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-rsf_mock}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-local_mock_only}
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  rsf-api:
    image: ghcr.io/ondc-official/rsf-bulk-utility-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_USER:-rsf_mock}:${MONGO_PASSWORD:-local_mock_only}@mongo:27017/rsf_utility?authSource=admin
      DATABASE_NAME: rsf_utility
      MOCK_NP_URL: http://rsf-api:3000/mock-np
      TUNNEL_URL: ${TUNNEL_URL:-${tunnel_url:-}}
      SEED_DEMO: ${SEED_DEMO:-true}
      DEMO_SUBSCRIBER_URL: ${DEMO_SUBSCRIBER_URL:-http://localhost:3000/mock-np}
      ONDC_AUTH_MODE: ${ONDC_AUTH_MODE:-disabled}
      ONDC_SUBSCRIBER_ID: ${ONDC_SUBSCRIBER_ID:-}
      ONDC_UNIQUE_KEY_ID: ${ONDC_UNIQUE_KEY_ID:-}
      ONDC_SIGNING_PRIVATE_KEY: ${ONDC_SIGNING_PRIVATE_KEY:-}
      ONDC_SIGNING_PUBLIC_KEY: ${ONDC_SIGNING_PUBLIC_KEY:-}
      ONDC_TRUSTED_PUBLIC_KEYS_JSON: ${ONDC_TRUSTED_PUBLIC_KEYS_JSON:-}
      ONDC_REGISTRY_LOOKUP_URL: ${ONDC_REGISTRY_LOOKUP_URL:-}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    image: ghcr.io/ondc-official/rsf-bulk-utility-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - rsf-api
    ports:
      - "5173:80"

volumes:
  mongo_data:
